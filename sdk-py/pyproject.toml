[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofchain-sdk"
version = "0.1.0a1"
description = "Cryptographic audit trail for AI agents on the live web. Drop-in MCP provenance layer for Bright Data."
authors = [{name = "Sardor Razikov", email = "razikovsardor1@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai-agents", "mcp", "bright-data", "web-scraping", "provenance", "ed25519", "audit", "compliance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "httpx>=0.27.0",
  "pynacl>=1.5.0",
  "pydantic>=2.5.0",
]

[project.urls]
Homepage = "https://proofchain.dev"
Repository = "https://github.com/SRKRZ23/proofchain"
Documentation = "https://proofchain.dev/docs"
Issues = "https://github.com/SRKRZ23/proofchain/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["proofchain*"]
