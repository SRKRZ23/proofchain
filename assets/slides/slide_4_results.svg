<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .brand { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
      .heading { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-weight: 700; }
      .body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-weight: 400; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#0a0e1a"/>
  <rect x="0" y="0" width="22" height="1080" fill="#10b981"/>

  <text x="100" y="120" class="brand" fill="#ffffff" font-size="72">Verified, not claimed</text>
  <text x="100" y="180" class="body" fill="#9ca3af" font-size="28">Every number below produced by a passing test or benchmark run</text>

  <!-- 6 KPI cards -->
  <g transform="translate(100, 260)">
    <rect x="0" y="0" width="540" height="180" rx="16" fill="#131826" stroke="#10b981" stroke-width="2"/>
    <text x="40" y="100" class="brand" fill="#10b981" font-size="100">51/51</text>
    <text x="40" y="145" class="body" fill="#ffffff" font-size="26" font-weight="700">tests passing</text>
    <text x="280" y="100" class="body" fill="#9ca3af" font-size="20">Ed25519 + hash chain +</text>
    <text x="280" y="125" class="body" fill="#9ca3af" font-size="20">tamper detection + API</text>
    <text x="280" y="150" class="body" fill="#9ca3af" font-size="20">endpoints + 1000-record stress</text>

    <rect x="580" y="0" width="540" height="180" rx="16" fill="#131826" stroke="#10b981" stroke-width="2"/>
    <text x="620" y="100" class="brand" fill="#10b981" font-size="100">10/10</text>
    <text x="620" y="145" class="body" fill="#ffffff" font-size="26" font-weight="700">enterprise questions</text>
    <text x="860" y="100" class="body" fill="#9ca3af" font-size="20">5.0 avg citations</text>
    <text x="860" y="125" class="body" fill="#9ca3af" font-size="20">0.82 avg confidence</text>
    <text x="860" y="150" class="body" fill="#9ca3af" font-size="20">100% success rate</text>

    <rect x="1160" y="0" width="540" height="180" rx="16" fill="#131826" stroke="#10b981" stroke-width="2"/>
    <text x="1200" y="100" class="brand" fill="#10b981" font-size="100">40</text>
    <text x="1200" y="145" class="body" fill="#ffffff" font-size="26" font-weight="700">evidence packets</text>
    <text x="1380" y="100" class="body" fill="#9ca3af" font-size="20">Generated in benchmark</text>
    <text x="1380" y="125" class="body" fill="#9ca3af" font-size="20">Chain verifies end-to-end</text>
    <text x="1380" y="150" class="body" fill="#9ca3af" font-size="20">Tamper detected on demo</text>
  </g>

  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="540" height="180" rx="16" fill="#131826" stroke="#10b981" stroke-width="2"/>
    <text x="40" y="100" class="brand" fill="#10b981" font-size="100">4</text>
    <text x="40" y="145" class="body" fill="#ffffff" font-size="26" font-weight="700">Bright Data products</text>
    <text x="180" y="100" class="body" fill="#9ca3af" font-size="20">SERP API</text>
    <text x="180" y="125" class="body" fill="#9ca3af" font-size="20">Web Scraper API</text>
    <text x="180" y="150" class="body" fill="#9ca3af" font-size="20">Web Unlocker + Scraping Browser</text>

    <rect x="580" y="0" width="540" height="180" rx="16" fill="#131826" stroke="#10b981" stroke-width="2"/>
    <text x="620" y="100" class="brand" fill="#10b981" font-size="100">87</text>
    <text x="620" y="120" class="body" fill="#9ca3af" font-size="22">KB</text>
    <text x="620" y="155" class="body" fill="#ffffff" font-size="26" font-weight="700">frontend bundle</text>
    <text x="800" y="100" class="body" fill="#9ca3af" font-size="20">Next.js 14 production build</text>
    <text x="800" y="125" class="body" fill="#9ca3af" font-size="20">5 static pages</text>
    <text x="800" y="150" class="body" fill="#9ca3af" font-size="20">TypeScript clean (0 errors)</text>

    <rect x="1160" y="0" width="540" height="180" rx="16" fill="#131826" stroke="#10b981" stroke-width="2"/>
    <text x="1200" y="100" class="brand" fill="#10b981" font-size="100">MIT</text>
    <text x="1200" y="145" class="body" fill="#ffffff" font-size="26" font-weight="700">open source</text>
    <text x="1380" y="100" class="body" fill="#9ca3af" font-size="20">Pre-hackathon committed</text>
    <text x="1380" y="125" class="body" fill="#9ca3af" font-size="20">github.com/SRKRZ23/proofchain</text>
    <text x="1380" y="150" class="body" fill="#9ca3af" font-size="20">SDK on PyPI + npm (planned)</text>
  </g>

  <!-- Bottom: Stress test bar -->
  <g transform="translate(100, 720)">
    <rect x="0" y="0" width="1720" height="180" rx="16" fill="#131826" stroke="#10b981" stroke-width="2"/>
    <text x="40" y="60" class="heading" fill="#ffffff" font-size="34">Stress test: 1000 records</text>
    <text x="40" y="110" class="body" fill="#10b981" font-size="24">Whole-chain Ed25519 verification: TRUE · &lt;1s wall time</text>
    <text x="40" y="150" class="body" fill="#9ca3af" font-size="22">Production-grade reliability validated · no GC pressure · constant memory</text>
  </g>

  <text x="960" y="1010" text-anchor="middle" class="body" fill="#9ca3af" font-size="22">Reproduce: `python3 -m pytest tests/ backend/tests/ -v` · `python3 benchmarks/run_benchmark.py`</text>
</svg>